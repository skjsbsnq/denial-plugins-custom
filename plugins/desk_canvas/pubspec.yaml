name: desk_canvas
description: Personal desktop icons and files plugin for Denial.
publish_to: none
version: 0.1.0
environment:
  sdk: ^3.13.0
  flutter: 3.47.5
dependencies:
  denial_sdk: '0.0.0'
  denial_flutter_sdk: '0.0.0'
  flutter_riverpod: ^3.0.0
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

denial_plugin:
  schema: 1
  name: Desk Canvas
  provides:
    - contract: package:denial_flutter_sdk/surfaces.dart#ShellSurface
